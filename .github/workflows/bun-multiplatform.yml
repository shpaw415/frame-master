name: Bun – Multi-Platform CI

on:
  push:
    branches: [main]
    paths:
      - "packages/frame-master/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/bun-multiplatform.yml"
  pull_request:
    paths:
      - "packages/frame-master/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/bun-multiplatform.yml"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: packages/frame-master

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test
